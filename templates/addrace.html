<!DOCTYPE html>
<!-- used Claude to explain the input validation patterns and the Jinja2 conditional for showing errors -->
<html lang="en">
<head>
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Add Race</title>
    <link rel="icon" href="/static/images/favicon.ico">
</head>
<body>
    {% include "navbar.html" %}
    <main>
    <div class="addracehead">
        <a href="/racetracker" class="btn btnb">← Back</a>
        <h1>Add Race</h1>
    </div>

    <!-- shows an error message if the form was submitted with missing fields -->
    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}

    <div class="addrace-right">
        <form method="POST" action="/addrace" class="addrace-form"> 
            <!-- main race details section sport location date and length -->
            <div class="formSection">
                <p class="formLabel">RACE DETAILS</p>
                
                <div class="form-grid">
                    <div class="form-area">
                        <label for="name">Sport</label>
                        <select id="name" name="name" required>
                            <option value="" disabled selected>Select a sport</option>
                            <option value="Running">Running</option>
                            <option value="Swimming">Swimming</option>
                            <option value="Rowing">Rowing</option>
                            <option value="Cycling">Cycling</option>
                        </select>
                    </div>

                    <div class="form-area">
                        <label for="location">Location</label>
                        <!-- oninput strips numbers from location since location names should only be letters -->
                        <input type="text" id="location" name="location" placeholder="e.g. Leeds" oninput="this.value = this.value.replace(/[0-9]/g, '')">
                    </div>

                    <div class="form-area">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-area">
                        <label for="race_type">Length in km (max 100)</label>
                        <!-- oninput keeps only numbers and one decimal point, and caps the value at 100 -->
                        <input type="text" id="race_type" name="race_type" placeholder="e.g. 10" inputmode="decimal" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1'); if(this.value && parseFloat(this.value) > 100) this.value = '100';" required>
                    </div>
                </div>
            </div>

            <!-- optional result section for past races, finish time and PB are calculated automatically -->
            <div class="formSection">
                <p class="formLabel">RESULT (Optional)</p>

                <div class="form-grid">
                    <div class="form-area">
                        <label for="finish_time">Finish Time (HH:MM:SS)</label>
                        <input type="text" id="finish_time" name="finish_time" placeholder="e.g. 01:30:00" oninput="this.value = this.value.replace(/[^0-9:]/g, ''); if(this.value === '00:00:00') this.value = '';" pattern="^([0-9]{1,2}):([0-5][0-9]):([0-5][0-9])$" title="Enter time as HH:MM:SS (e.g. 01:30:00)">
                        <p class="form-helper" style="font-size: 0.75rem; color: #888; margin-top: 0.25rem;">Format: Hours:Minutes:Seconds (e.g. 01:30:00 for 1 hour 30 minutes)</p>
                    </div>
                </div>

                <p class="form-helper">Personal bests are calculated automatically from your finish time.</p>
            </div>

            <div class="form-actions">
                <a href="/racetracker" class="btn btnb">Cancel</a>
                <button type="submit" class="btn btna">Save Race</button>
            </div>
        </form>
        <!-- preview image that changes based on the sport selected, handled by races.js -->
        <div class="movingpics">
            <img id="raceimg" src="/static/images/Pic1.jpg" alt="Sport">
            <p class="race-img-label" id="race-label">Your Sport</p>
        </div>
    </div>
</main>
<script src="/static/js/races.js"></script>
</body>
</html>
