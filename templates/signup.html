<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack | Sign Up</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">

            <div class="auth-header">
                <h1>Create account</h1>
                <p class="auth-sub">Start tracking your fitness today.</p>
            </div>

            {% if error %}
                <div class="auth-error">⚠ {{ error }}</div>
            {% endif %}

            <!-- accessibility - for and id attributes connect each label to its input
screen readers announce each label when user focuses on each input field -->
            <form action="/signup" method="post" class="auth-form">
                <div class="form-group">
                    <label for="signup-name">Full name</label>
                    <input
                        type="text"
                        id="signup-name"
                        name="name"
                        placeholder="Alex Johnson"
                        value="{{ prefill_name or '' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input
                        type="email"
                        id="signup-email"
                        name="email"
                        placeholder="alex@example.com"
                        value="{{ prefill_email or '' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <!-- accessibility - for/id connects this label to the password input above -->
                    <input type="password" id="signup-password" name="password" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <!-- accessibility - for/id connects this label to the confirm password input -->
                    <label for="signup-confirm">Confirm password</label>
                    <input type="password" id="signup-confirm" name="confirm" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Create account
                </button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="/login">Log in</a>
            </p>

        </div>
    </div>
</body>
</html>
