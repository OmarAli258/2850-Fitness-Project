<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack | Sign Up</title>

    <!-- Main stylesheet for the signup/auth page -->
    <link rel="stylesheet" href="/static/css/main.css">

    <!-- Inter font used for a consistent modern layout -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Full-page container that centres the signup card -->
    <div class="auth-page">
        <div class="auth-card">

            <!-- Signup page heading -->
            <div class="auth-header">
                <h1>Create account</h1>
                <p class="auth-sub">Start tracking your fitness today.</p>
            </div>

            <!-- Error message shown if validation fails -->
            {% if error %}
                <div class="auth-error">⚠ {{ error }}</div>
            {% endif %}

            <!-- AI support was used to help structure the signup form fields, validation flow and accessibility labels. -->
            <!-- accessibility - for and id attributes connect each label to its input
screen readers announce each label when user focuses on each input field -->
            <form action="/signup" method="post" class="auth-form">
                <div class="form-group">
                    <label for="signup-name">Full name</label>
                    <input
                        type="text"
                        id="signup-name"
                        name="name"
                        placeholder="Alex Johnson"
                        value="{{ prefill_name or '' }}"
                        pattern="^[a-zA-Z\s\-]+$"
                        title="Name cannot contain numbers or special characters"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input
                        type="email"
                        id="signup-email"
                        name="email"
                        placeholder="alex@example.com"
                        value="{{ prefill_email or '' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="signup-password" name="password" placeholder="Enter password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('signup-password')">👁</button>
                    </div>
                    <ul class="password-requirements">
                        <li id="req-length">At least 8 characters</li>
                        <li id="req-lower">One lowercase letter</li>
                        <li id="req-upper">One uppercase letter</li>
                        <li id="req-special">One special character</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="signup-confirm">Confirm password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="signup-confirm" name="confirm" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('signup-confirm')">👁</button>
                    </div>
                </div>

                <!-- Submits signup details to the /signup POST route -->
                <button type="submit" class="btn btn-primary btn-full">
                    Create account
                </button>
            </form>

            <!-- Link for users who already have an account -->
            <p class="auth-switch">
                Already have an account?
                <a href="/login">Log in</a>
            </p>

        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        const passwordInput = document.getElementById('signup-password');
        passwordInput.addEventListener('input', function() {
            const val = this.value;
            document.getElementById('req-length').classList.toggle('met', val.length >= 8);
            document.getElementById('req-lower').classList.toggle('met', /[a-z]/.test(val));
            document.getElementById('req-upper').classList.toggle('met', /[A-Z]/.test(val));
            document.getElementById('req-special').classList.toggle('met', /[ !\"#$%&'()*+,\-./:;<=>?@[\\\]^_`{|}~]/.test(val));
        });
    </script>
</body>
</html>
